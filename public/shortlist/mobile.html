body{background:#070504;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
.hint{color:var(--color-text-muted);font-size:12px;letter-spacing:0.04em;text-align:center;max-width:380px;}

/* ---------- Phone shell ---------- */
.phone{width:390px;height:800px;background:var(--color-surface-base);border-radius:56px;border:4px solid #0d0d0f;position:relative;overflow:hidden;
  box-shadow:0 0 0 2px #34343a,0 0 0 3px rgba(0,0,0,0.55),0 30px 80px rgba(0,0,0,0.75),0 8px 22px rgba(0,0,0,0.5);}
.status-bar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;z-index:100;color:#2a221a;font-family:var(--font-sans);pointer-events:none;}
.sb-left{display:flex;align-items:center;gap:7px;}
.sb-time{font-size:15px;font-weight:700;letter-spacing:0.01em;}
.sb-person{width:15px;height:15px;}
.sb-right{display:flex;align-items:center;gap:6px;}
.sb-cell{width:18px;height:12px;}
.sb-wifi{width:17px;height:13px;}
.batt{position:relative;width:25px;height:13px;border-radius:4px;background:#2a221a;display:flex;align-items:center;justify-content:center;}
.batt::after{content:"";position:absolute;right:-3px;top:4px;width:2px;height:5px;border-radius:0 2px 2px 0;background:rgba(42,34,26,0.55);}
.batt-num{font-size:8.5px;font-weight:700;color:#fff;letter-spacing:-0.03em;}
.dynamic-island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#070506;border-radius:999px;z-index:101;}
.di-cam{position:absolute;top:20px;left:calc(50% + 64px);width:13px;height:13px;border-radius:50%;background:#070506;z-index:101;box-shadow:0 0 0 1px rgba(0,0,0,0.5);}
.di-cam::after{content:"";position:absolute;top:3.5px;left:3.5px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#46527f,#0d1220 70%);}
.app{position:absolute;inset:0;background:var(--color-bg-base);overflow:hidden;}

/* ---------- Screens ---------- */
.mscreen{position:absolute;inset:0;display:none;flex-direction:column;}
.mscreen.active{display:flex;}
.scroll{flex:1;overflow-y:auto;padding:0 var(--space-lg) 88px;scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}

/* ---------- Header ---------- */
.m-header{display:flex;align-items:center;justify-content:space-between;padding:46px var(--space-lg) 14px;}
.m-wordmark{display:flex;align-items:center;gap:9px;font-family:var(--font-serif);font-weight:500;font-size:14px;letter-spacing:0.26em;text-transform:uppercase;color:var(--color-text-secondary);}
.m-wordmark .dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent-primary);box-shadow:0 0 10px rgba(224,120,64,0.7);}
.m-avatar{width:34px;height:34px;border-radius:50%;background:var(--color-surface-elevated);border:1px solid var(--color-border-hi);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--color-text-secondary);}

/* ---------- Add / Search ---------- */
.add-heading{font-family:var(--font-serif);font-weight:600;font-size:calc(var(--type-display-size) * 0.8);line-height:1.1;color:var(--color-text-strong);margin:6px 0 8px;}
.add-sub{color:var(--color-text-secondary);font-size:var(--type-body-size);margin-bottom:30px;}
.search-bar{display:flex;align-items:center;gap:10px;background:var(--color-surface-raised);border:1.5px solid var(--color-border-hairline);border-radius:var(--radius-pill);padding:13px 18px;transition:border-color var(--duration-fast);}
.search-bar.active{border-color:var(--color-accent-primary);}
.search-icon{width:18px;height:18px;flex-shrink:0;color:var(--color-text-muted);}
#searchinput{flex:1;background:none;border:none;outline:none;color:var(--color-text-primary);font-family:var(--font-sans);font-size:16px;}
#searchinput::placeholder{color:var(--color-text-muted);}
.hint-row{font-size:12px;color:var(--color-text-muted);margin:12px 2px 4px;letter-spacing:0.02em;}

.results{margin-top:8px;}
.results-label{font-size:var(--type-caps-size);font-weight:700;letter-spacing:var(--type-caps-tracking);text-transform:uppercase;color:var(--color-text-muted);margin:10px 2px 2px;}
.results-sublabel{font-size:12px;color:var(--color-accent-primary);margin:0 2px 12px;}
.result-item{display:flex;align-items:center;gap:13px;padding:10px;border-radius:var(--radius-md);cursor:pointer;transition:background var(--duration-fast);}
.result-item:active{background:var(--color-surface-raised);}
.result-item.onlist{opacity:0.92;}
.result-thumb{width:46px;height:64px;border-radius:7px;overflow:hidden;flex-shrink:0;box-shadow:var(--shadow-surface);}
.result-info{flex:1;min-width:0;}
.result-title{font-family:var(--font-serif);font-weight:500;font-size:17px;color:var(--color-text-primary);}
.result-meta{font-size:13px;color:var(--color-text-secondary);margin-top:2px;}
.result-onlist{font-size:12px;color:var(--color-status-success);margin-top:3px;font-weight:600;}
.result-add{width:34px;height:34px;border-radius:50%;background:var(--color-accent-soft);border:1px solid rgba(224,120,64,0.3);color:var(--color-accent-primary);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex-shrink:0;}
.empty-state{text-align:center;padding:54px 20px;color:var(--color-text-muted);}
.empty-icon{width:52px;height:52px;border-radius:50%;border:2px dashed rgba(168,160,152,0.3);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;color:var(--color-text-muted);}
.empty-text{font-size:14px;line-height:1.6;}
.manual-add{color:var(--color-accent-primary);font-weight:600;}

/* ---------- My List ---------- */
.list-count-row{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px;}
#listcount{font-size:14px;color:var(--color-text-secondary);font-weight:500;}
.filter-pills{display:flex;gap:9px;padding:0 0 16px;}
.fpill{border-radius:var(--radius-pill);border:2px solid var(--color-pill-border);background:var(--color-pill-bg);color:var(--color-text-secondary);font-family:var(--font-sans);font-weight:600;font-size:13px;padding:7px 15px;cursor:pointer;transition:border-color var(--duration-fast),background var(--duration-fast),color var(--duration-fast);}
.fpill.is-active{border-color:var(--color-accent-interactive);background:var(--color-accent-interactive);color:#fff;}

.tv-chip{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(100deg,rgba(224,120,64,0.16),rgba(224,120,64,0.06));border:1px solid rgba(224,120,64,0.28);color:var(--color-text-primary);border-radius:var(--radius-md);padding:13px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px;transition:transform var(--duration-fast);}
.tv-chip:active{transform:scale(0.98);}
.tv-ic{font-size:16px;}

.rec-list{display:flex;flex-direction:column;gap:12px;}
.rec-card{display:flex;gap:13px;background:var(--color-surface-raised);border:1px solid var(--color-border-hairline);border-radius:var(--radius-md);padding:13px;animation:cardIn var(--duration-normal) var(--easing-decelerate);}
.rec-card.archived{opacity:0.5;}
.rec-card.out{animation:cardOut 0.28s var(--easing-standard) forwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes cardOut{to{opacity:0;transform:translateX(40px);height:0;padding-top:0;padding-bottom:0;margin-bottom:-12px;}}
.rc-thumb{width:58px;height:84px;border-radius:8px;overflow:hidden;flex-shrink:0;box-shadow:var(--shadow-surface);}
.rc-thumb img{width:100%;height:100%;object-fit:cover;}
.result-thumb img{width:100%;height:100%;object-fit:cover;}
.rc-body{flex:1;min-width:0;}
.rc-toprow{display:flex;align-items:center;gap:8px;}
.rc-title{font-family:var(--font-serif);font-weight:500;font-size:18px;color:var(--color-text-primary);flex:1;min-width:0;}
.rc-expand{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:1px solid var(--color-border-hi);background:transparent;color:var(--color-text-secondary);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rc-expand:active{background:var(--color-surface-elevated);}
.nw-badge{font-size:11px;font-weight:700;letter-spacing:0.03em;color:var(--color-accent-primary);background:var(--color-accent-soft);border:1px solid rgba(224,120,64,0.3);border-radius:var(--radius-pill);padding:3px 9px;white-space:nowrap;}
.status-chip{font-size:11px;font-weight:700;color:var(--color-text-muted);background:var(--color-subtle-bg);border:1px solid var(--color-border-hairline);border-radius:var(--radius-pill);padding:3px 9px;white-space:nowrap;}
.rc-meta{font-size:13px;color:var(--color-text-secondary);margin-top:4px;}
.rc-meta .rt{color:var(--color-note-rec);}
.rc-prov{margin-top:7px;}
.rc-note{font-family:var(--font-serif);font-style:italic;font-size:13px;color:var(--color-note-rec);line-height:1.45;margin-top:8px;border-left:2px solid rgba(212,172,132,0.3);padding-left:9px;}
.rc-note-by{font-family:var(--font-sans);font-style:normal;font-weight:700;color:var(--color-text-secondary);margin-right:3px;}
.rc-chips{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:9px;}
.rc-actions{display:flex;gap:8px;margin-top:11px;}
.rc-act{flex:1;text-align:center;border-radius:var(--radius-pill);padding:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--color-border-hairline);background:transparent;color:var(--color-text-secondary);font-family:var(--font-sans);transition:background var(--duration-fast);}
.rc-act.watched:active{background:rgba(106,170,82,0.16);color:var(--color-status-success);border-color:rgba(106,170,82,0.35);}
.rc-act.pass:active{background:var(--color-subtle-bg);}
.list-empty{text-align:center;color:var(--color-text-muted);font-size:14px;padding:48px 20px;line-height:1.6;}
.list-addbtn{width:100%;margin-top:16px;background:var(--color-accent-interactive);color:#fff;border:none;border-radius:var(--radius-pill);padding:15px;font-family:var(--font-sans);font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-button);transition:transform var(--duration-fast);}
.list-addbtn:active{transform:scale(0.98);}

/* who chips / avatars */
.who-chip{display:inline-flex;align-items:center;gap:6px;background:var(--color-chip-bg);border-radius:var(--radius-pill);padding:3px 10px 3px 3px;}
.who-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:10px;}
.who-name{font-size:12px;font-weight:600;color:var(--color-note-rec);}
.who-more{font-size:12px;font-weight:700;color:var(--color-accent-primary);background:var(--color-accent-soft);border:1px solid rgba(224,120,64,0.25);border-radius:var(--radius-pill);padding:3px 9px;}
.who-none{font-size:12px;color:var(--color-text-muted);font-style:italic;}

/* subscription badge */
.sub-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;background:rgba(106,170,82,0.14);border:1px solid rgba(106,170,82,0.35);color:var(--color-status-success);}
.sub-badge.req{background:rgba(224,120,64,0.14);border-color:rgba(224,120,64,0.4);color:var(--color-accent-primary);}
.sub-badge .ic{width:12px;height:12px;}

/* poster art */
.poster-art{width:100%;height:100%;display:flex;align-items:flex-end;padding:7px;position:relative;}
.poster-art .pa-t{font-family:var(--font-serif);font-weight:600;font-size:12px;color:rgba(255,255,255,0.95);text-shadow:0 1px 6px rgba(0,0,0,0.6);line-height:1.1;}
.pa-shrinking{background:linear-gradient(160deg,#5a8a6a,#3a6048 45%,#22402f);}
.pa-severance{background:linear-gradient(180deg,#cdd4e0,#9aa8be 45%,#46566e);}
.pa-severance .pa-t{color:#1b2436;text-shadow:none;}
.pa-wicked{background:radial-gradient(120% 90% at 30% 20%,#2f9f73,#1f5a48 55%,#123026);}
.pa-obaa{background:linear-gradient(160deg,#9a4a2c,#6a2e1c 50%,#2c1410);}
.pa-bear{background:linear-gradient(165deg,#c79a6a,#9a6a4a 45%,#5a3424);}
.pa-cocainebear{background:linear-gradient(150deg,#c84a6a,#7a2a8a 55%,#2a1840);}
.pa-hacks{background:radial-gradient(120% 100% at 70% 20%,#b03a8a,#6a2a7a 55%,#2a1640);}
.pa-dark{background:conic-gradient(from 210deg at 50% 50%,#1b2740,#0e1626,#243a5e,#0e1626,#1b2740);}
.pa-office{background:linear-gradient(160deg,#5a6a7a,#3a4654 50%,#222a34);}
.pa-officespace{background:linear-gradient(155deg,#b59a5a,#7a5a34 50%,#3a2a18);}
.pa-default{background:linear-gradient(160deg,#3a3430,#241f1a);}

/* ---------- TV handoff placeholder ---------- */
#m-tv .tv-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:18px;}
.tv-screen-icon{width:84px;height:84px;border-radius:22px;background:var(--color-surface-raised);border:1px solid var(--color-border-hi);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:var(--shadow-card-raised);}
.tv-screen-icon::after{content:"";position:absolute;}
.tv-title{font-family:var(--font-serif);font-weight:600;font-size:26px;color:var(--color-text-strong);}
.tv-body{color:var(--color-text-secondary);font-size:15px;line-height:1.6;max-width:280px;}
.tv-ring{display:inline-flex;align-items:center;gap:7px;color:var(--color-status-success);font-size:13px;font-weight:600;}
.tv-ring .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--color-status-success);display:flex;align-items:center;justify-content:center;font-size:10px;}
.tv-back{margin-top:8px;background:var(--color-accent-interactive);color:#fff;border:none;border-radius:var(--radius-pill);padding:13px 28px;font-family:var(--font-sans);font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-button);}

/* ---------- Tab bar ---------- */
.tabbar{position:absolute;bottom:14px;left:12px;right:12px;background:var(--color-surface-base);border:1px solid var(--color-border-hairline);border-radius:22px;display:flex;gap:6px;padding:5px;z-index:40;box-shadow:0 8px 24px rgba(60,40,20,0.18);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);}
.tab{flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--color-text-muted);font-size:13px;font-weight:600;padding:9px;border-radius:16px;transition:background var(--duration-fast),color var(--duration-fast);}
.tab.active{color:var(--color-accent-primary);background:var(--color-accent-soft);}
.tab-icon{width:20px;height:20px;}

/* ---------- Toast ---------- */
.toast{position:absolute;left:14px;right:14px;bottom:84px;background:var(--color-surface-elevated);border:1px solid var(--color-border-hi);border-radius:var(--radius-md);padding:13px 15px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow-card-raised);z-index:55;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity var(--duration-normal),transform var(--duration-normal);}
.toast.show{opacity:1;transform:none;pointer-events:auto;}
.toast-check{width:22px;height:22px;border-radius:50%;background:rgba(106,170,82,0.18);border:1px solid rgba(106,170,82,0.4);color:var(--color-status-success);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
#toast-text{flex:1;font-size:13px;color:var(--color-text-primary);font-weight:500;}
#toast-action{background:none;border:none;color:var(--color-accent-primary);font-family:var(--font-sans);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;padding:4px 6px;}

/* ---------- Sheet ---------- */
.sheet-scrim{position:absolute;inset:0;background:rgba(8,6,4,0.6);opacity:0;pointer-events:none;transition:opacity var(--duration-normal);z-index:45;}
.sheet-scrim.show{opacity:1;pointer-events:auto;}
.enrich-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--color-surface-base);border-top:1px solid var(--color-border-hi);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:10px 20px 26px;z-index:50;transform:translateY(105%);transition:transform var(--duration-normal) var(--easing-decelerate);box-shadow:0 -16px 48px rgba(0,0,0,0.5);}
.enrich-sheet.show{transform:none;}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--color-handle);margin:4px auto 16px;}
.sheet-saved-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.sheet-check{width:20px;height:20px;border-radius:50%;background:rgba(106,170,82,0.18);border:1px solid rgba(106,170,82,0.4);color:var(--color-status-success);display:flex;align-items:center;justify-content:center;font-size:11px;}
#sheet-saved-text{font-size:12px;color:var(--color-status-success);font-weight:600;}
.sheet-title{font-family:var(--font-serif);font-weight:600;font-size:24px;color:var(--color-text-strong);}
.sheet-sub{color:var(--color-text-secondary);font-size:14px;margin:3px 0 16px;}
#sheet-chips{margin-bottom:16px;}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.field label{font-size:var(--type-caps-size);font-weight:700;letter-spacing:var(--type-caps-tracking);text-transform:uppercase;color:var(--color-text-muted);}
.field input{background:var(--color-surface-base);border:1.5px solid var(--color-border-hairline);border-radius:var(--radius-md);padding:13px 15px;color:var(--color-text-primary);font-family:var(--font-sans);font-size:16px;outline:none;transition:border-color var(--duration-fast);}
.field input:focus{border-color:var(--color-accent-primary);}
.field input::placeholder{color:var(--color-text-muted);}
.note-toggle{background:none;border:none;color:var(--color-accent-primary);font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;padding:2px 0 16px;text-align:left;}
.sheet-cta{width:100%;background:var(--color-accent-interactive);color:#fff;border:none;border-radius:var(--radius-pill);padding:15px;font-family:var(--font-sans);font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-button);transition:transform var(--duration-fast);margin-top:2px;}
.sheet-cta:active{transform:scale(0.98);}
.sheet-skip{width:100%;background:none;border:none;color:var(--color-text-muted);font-family:var(--font-sans);font-size:13px;cursor:pointer;padding:14px 0 2px;}
.field-label{font-size:var(--type-caps-size);font-weight:700;letter-spacing:var(--type-caps-tracking);text-transform:uppercase;color:var(--color-text-muted);margin-bottom:8px;}
#sheet-saved-block{margin-bottom:16px;}
.field textarea{background:var(--color-surface-base);border:1.5px solid var(--color-border-hairline);border-radius:var(--radius-md);padding:13px 15px;color:var(--color-text-primary);font-family:var(--font-sans);font-size:16px;outline:none;resize:none;transition:border-color var(--duration-fast);}
.field textarea:focus{border-color:var(--color-accent-primary);}
.field textarea::placeholder{color:var(--color-text-muted);}
.result-add.on{background:rgba(106,170,82,0.14);border-color:rgba(106,170,82,0.35);color:var(--color-status-success);}
.rc-more{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:none;background:transparent;color:var(--color-text-muted);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rc-more:active{background:var(--color-subtle-bg);}
.back-active{background:none;border:none;color:var(--color-accent-primary);font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;padding:2px 0 16px;text-align:left;}
.menu-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--color-surface-elevated);border-top:1px solid var(--color-border-hi);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:50;transform:translateY(110%);transition:transform var(--duration-normal) var(--easing-decelerate);box-shadow:0 -16px 48px rgba(0,0,0,0.5);overflow:hidden;}
.menu-sheet.show{transform:none;}
.menu-item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--color-border-hairline);color:var(--color-text-primary);font-family:var(--font-sans);font-size:16px;font-weight:500;padding:16px 22px;cursor:pointer;}
.menu-item:last-child{border-bottom:none;}
.filter-row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:0 0 16px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-caps{font-size:var(--type-caps-size);font-weight:700;letter-spacing:var(--type-caps-tracking);text-transform:uppercase;color:var(--color-text-muted);white-space:nowrap;margin-right:2px;}
.rec-list{gap:22px;}
.lc{cursor:pointer;}
.lc-img{width:100%;aspect-ratio:16/10;border-radius:var(--radius-md);overflow:hidden;position:relative;box-shadow:var(--shadow-surface);}
.lc-img img{width:100%;height:100%;object-fit:cover;}
.lc-img .poster-art{width:100%;height:100%;}
.lc-img .pa-t{font-family:var(--font-serif);font-weight:600;font-size:18px;color:rgba(255,255,255,0.96);text-shadow:0 1px 8px rgba(0,0,0,0.5);padding:12px;}
.lc-badge,.lc-status{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:var(--radius-pill);background:var(--color-surface-base);color:var(--color-text-primary);box-shadow:var(--shadow-surface);}
.lc-status{background:rgba(0,0,0,0.6);color:#fff;}
.lc-info{padding:10px 2px 0;}
.lc-title{font-family:var(--font-serif);font-weight:500;font-size:18px;color:var(--color-text-primary);}
.lc-meta{font-size:13px;color:var(--color-text-secondary);margin-top:3px;}
.lc-meta .rt{color:var(--color-note-rec);}
.lc-avs{display:flex;align-items:center;margin-top:9px;}
.lc-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:10px;border:2px solid var(--color-bg-base);margin-left:-6px;}
.lc-av:first-child{margin-left:0;}
.lc-av-more{background:var(--color-surface-elevated);color:var(--color-note-rec);}
.detail-scroll{flex:1;overflow-y:auto;scrollbar-width:none;}
.detail-scroll::-webkit-scrollbar{display:none;}
.d-hero{position:relative;width:100%;aspect-ratio:16/11;overflow:hidden;}
.d-hero img{width:100%;height:100%;object-fit:cover;}
.d-hero .poster-art{width:100%;height:100%;}
.d-hero .pa-t{display:none;}
.d-back,.d-more{position:absolute;top:46px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,0.92);color:#201c18;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-surface);}
.d-back{left:16px;}
.d-more{right:16px;}
.d-content{padding:20px var(--space-lg) 32px;}
.d-title{font-family:var(--font-serif);font-weight:600;font-size:26px;color:var(--color-text-strong);}
.d-meta{font-size:14px;color:var(--color-text-secondary);margin-top:6px;}
.d-meta .rt{color:var(--color-note-rec);}
.d-prov{margin-top:10px;}
.d-notes{margin-top:14px;display:flex;flex-direction:column;gap:14px;}
.d-note{display:flex;gap:10px;}
.d-note-av{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;}
.d-note-name{font-weight:700;font-size:13px;color:var(--color-text-primary);}
.d-note-text{font-size:14px;color:var(--color-text-secondary);line-height:1.45;margin-top:2px;}
.d-add{margin-top:20px;background:var(--color-accent-interactive);color:#fff;border:none;border-radius:var(--radius-pill);padding:15px;width:100%;font-family:var(--font-sans);font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-button);}
.d-actions{display:flex;gap:10px;margin-top:14px;}
.d-act{flex:1;text-align:center;border-radius:var(--radius-pill);padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-sans);border:1px solid var(--color-border-hairline);background:var(--color-surface-base);color:var(--color-text-primary);}
.d-act.watched.is-watched{color:var(--color-status-success);border-color:rgba(106,170,82,0.45);}
.d-act.restore{background:var(--color-accent-interactive);color:#fff;border:none;box-shadow:var(--shadow-button);}
.detail-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--color-surface-base);border-radius:24px 24px 0 0;max-height:85vh;display:flex;flex-direction:column;z-index:50;transform:translateY(105%);transition:transform var(--duration-normal) var(--easing-decelerate);box-shadow:0 -16px 48px rgba(0,0,0,0.5);overflow:hidden;}
.detail-sheet.show{transform:none;}
.detail-sheet .sheet-handle{margin:8px auto 4px;flex-shrink:0;}
.fbubble{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-pill);border:1px solid var(--color-border-hi);background:var(--color-surface-base);color:var(--color-text-primary);font-family:var(--font-sans);font-size:14px;font-weight:600;padding:9px 15px;cursor:pointer;white-space:nowrap;}
.fbubble.is-on{background:var(--color-accent-primary);border-color:var(--color-accent-primary);color:#fff;}
.fb-chev{width:13px;height:13px;flex-shrink:0;}
.fb-x{font-size:12px;margin-left:1px;}
.rt-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--color-surface-elevated);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:55;transform:translateY(110%);transition:transform var(--duration-normal) var(--easing-decelerate);box-shadow:0 -16px 48px rgba(0,0,0,0.5);padding:8px 20px 26px;}
.rt-sheet.show{transform:none;}
.rt-sheet .sheet-handle{margin:4px auto 14px;}
.rt-title{font-family:var(--font-serif);font-weight:600;font-size:20px;color:var(--color-text-strong);margin:2px 0 16px;}
.rt-options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.rt-opt{text-align:left;border-radius:var(--radius-md);border:1.5px solid var(--color-border-hairline);background:var(--color-surface-base);color:var(--color-text-primary);font-family:var(--font-sans);font-size:15px;font-weight:500;padding:14px 16px;cursor:pointer;}
.rt-opt.is-active{border-color:var(--color-accent-primary);background:var(--color-accent-soft);color:var(--color-accent-primary);font-weight:700;}
.rt-done{width:100%;background:var(--color-accent-interactive);color:#fff;border:none;border-radius:var(--radius-pill);padding:15px;font-family:var(--font-sans);font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-button);}
.clear-filters{display:inline-block;margin-top:10px;background:none;border:none;color:var(--color-accent-primary);font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;}
.detail-screen{position:absolute;inset:0;z-index:60;opacity:0;pointer-events:none;transition:opacity var(--duration-normal);background:var(--color-bg-base);}
.detail-screen.show{opacity:1;pointer-events:auto;}
.detail-hero{position:absolute;top:0;left:0;right:0;height:46%;overflow:hidden;}
.detail-hero img{width:100%;height:100%;object-fit:cover;}
.detail-hero .poster-art{width:100%;height:100%;}
.detail-hero .pa-t{font-family:var(--font-serif);font-weight:600;font-size:24px;color:rgba(255,255,255,0.96);text-shadow:0 2px 12px rgba(0,0,0,0.55);padding:18px;}
.detail-top{position:absolute;top:46px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:3;}
.d-icon-group{display:flex;gap:10px;}
.d-icon{width:40px;height:40px;border-radius:50%;border:none;background:rgba(250,248,245,0.60);-webkit-backdrop-filter:blur(8px) saturate(1.1);backdrop-filter:blur(8px) saturate(1.1);color:#2a221a;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,0.14);}
.d-icon svg{width:20px;height:20px;display:block;}
.d-icon svg path{stroke-width:2;}
.detail-drawer{position:absolute;left:0;right:0;bottom:0;top:40%;background:var(--color-surface-base);border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -18px 48px rgba(0,0,0,0.25);transform:translateY(6%);transition:transform var(--duration-normal) var(--easing-decelerate);}
.detail-screen.show .detail-drawer{transform:none;}
.detail-drawer .sheet-handle{margin:10px auto 4px;flex-shrink:0;}
.detail-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:24px;}
.detail-scroll::-webkit-scrollbar{display:none;}
.d-edit-title{font-family:var(--font-serif);font-weight:600;font-size:22px;color:var(--color-text-strong);margin:4px 0 16px;}
.d-watched-tag{font-family:var(--font-sans);font-size:12px;font-weight:700;color:var(--color-status-success);margin-left:8px;white-space:nowrap;}
#menu-scrim{z-index:70;}
.menu-sheet{z-index:71;}
.toast{z-index:80;}
.poster-art{position:relative;}
.pa-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
</style>
</head>

<div class="phone">
  <div class="status-bar">
    <div class="sb-left">
      <span class="sb-time">12:34</span>
      <svg class="sb-person" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg>
    </div>
    <div class="sb-right">
      <svg class="sb-cell" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0.5" width="3" height="11.5" rx="1"/></svg>
      <svg class="sb-wifi" viewBox="0 0 18 13" fill="currentColor"><path d="M9 2.6c2.9 0 5.6 1.1 7.6 3l-1.5 1.6C13.5 5.7 11.4 4.9 9 4.9S4.5 5.7 2.9 7.2L1.4 5.6C3.4 3.7 6.1 2.6 9 2.6Z"/><path d="M9 6.6c1.8 0 3.4.7 4.6 1.8l-1.6 1.6C11.2 9.3 10.1 8.9 9 8.9s-2.2.4-3 1.1L4.4 8.4C5.6 7.3 7.2 6.6 9 6.6Z"/><circle cx="9" cy="11.4" r="1.3"/></svg>
      <span class="batt"><span class="batt-num">68</span></span>
    </div>
  </div>
  <div class="dynamic-island"></div>
  <div class="di-cam"></div>
  <div class="app">

    <!-- ========= ADD / SEARCH ========= -->
    <div id="m-add" class="mscreen active">
      <div class="m-header">
        <span class="m-spacer"></span>
        <div class="m-avatar">K</div>
      </div>
      <div class="scroll">
        <div class="add-heading">Got a rec?</div>
        <div class="add-sub">Search and tap to save. Details are optional.</div>
        <div class="search-bar" id="searchbar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchinput" placeholder="Search for a show or movie…" autocomplete="off">
        </div>
        <div class="results" id="results"></div>
      </div>
    </div>

    <!-- ========= MY LIST ========= -->
    <div id="m-list" class="mscreen">
      <div class="m-header">
        <span class="m-spacer"></span>
        <div class="m-avatar">K</div>
      </div>
      <div class="scroll">
        <div class="add-heading">My List</div>
        <div class="list-count-row"><span id="listcount">0 saved</span></div>
        <div class="filter-row">
          <button class="fbubble" id="fb-runtime">Runtime <svg class="fb-chev" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="fbubble" id="fb-unwatched">Show watched</button>
        </div>
        <div class="rec-list" id="reclist"></div>
        <button class="list-addbtn" id="list-addbtn">+ Add a rec</button>
      </div>
    </div>

    <!-- ========= TV HANDOFF PLACEHOLDER ========= -->
    <div id="m-tv" class="mscreen">
      <div class="tv-wrap">
        <div class="tv-screen-icon">📺</div>
        <div class="tv-title">Open on your TV</div>
        <div class="tv-body">Your Shortlist is ready on the big screen. Open the Shortlist app on your TV and tonight’s picks will be waiting.</div>
        <div class="tv-ring"><span class="r">✓</span> Synced to this account</div>
        <button class="tv-back" id="tv-back">Back to my list</button>
      </div>
    </div>

    <!-- ========= DETAIL (image surface + floating drawer) ========= -->
    <div id="m-detail" class="detail-screen">
      <div class="detail-hero" id="detail-hero"></div>
      <div class="detail-top">
        <button class="d-icon" id="d-back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="d-icon-group">
          <button class="d-icon" id="d-share" aria-label="Share"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15V4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 7.5L12 4l3.5 3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 11v7a1.2 1.2 0 001.2 1.2h9.6a1.2 1.2 0 001.2-1.2v-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="d-icon" id="d-more" aria-label="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
        </div>
      </div>
      <div class="detail-drawer">
        <div class="detail-scroll" id="detail-body"></div>
      </div>
    </div>

    <!-- ========= RUNTIME FILTER SHEET ========= -->
    <div class="sheet-scrim" id="rt-scrim"></div>
    <div class="rt-sheet" id="rt-sheet">
      <div class="sheet-handle"></div>
      <div class="rt-title">Filter by runtime</div>
      <div class="rt-options">
        <button class="rt-opt" data-rt="">Any</button>
        <button class="rt-opt" data-rt="short">&lt; 35 min</button>
        <button class="rt-opt" data-rt="mid">35–60 min</button>
        <button class="rt-opt" data-rt="long">60+ min</button>
      </div>
      <button class="rt-done" id="rt-done">Done</button>
    </div>


    <!-- ========= TOAST ========= -->
    <div class="toast" id="toast">
      <span class="toast-check">✓</span>
      <span id="toast-text"></span>
      <button id="toast-action"></button>
    </div>

    <!-- ========= SAVE / DETAILS SHEET ========= -->
    <div class="sheet-scrim" id="scrim"></div>
    <div class="enrich-sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-sub" id="sheet-sub"></div>
      <div id="sheet-saved-block">
        <div class="field-label">Already saved — from:</div>
        <div class="rc-chips" id="sheet-chips"></div>
      </div>
      <div class="field" id="from-field">
        <label>From</label>
        <input id="sheet-who" placeholder="Who told you about this?" autocomplete="off">
      </div>
      <button class="note-toggle" id="note-toggle">＋ Add a note</button>
      <div class="field" id="note-field" style="display:none">
        <label>Note</label>
        <textarea id="sheet-note" rows="2" placeholder="What did they say about it?"></textarea>
      </div>
      <button class="sheet-cta" id="sheet-save"></button>
      <button class="sheet-skip" id="sheet-skip"></button>
    </div>

    <!-- ========= ACTION / PROFILE MENU ========= -->
    <div class="sheet-scrim" id="menu-scrim"></div>
    <div class="menu-sheet" id="menu-sheet"></div>

  </div>

  <!-- ========= TAB BAR ========= -->
  <div class="tabbar">
    <div class="tab active" id="tab-add">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Add</span>

      <span id="tab-list-label">My List</span>
    </div>
  </div>
</div>

  const d = item.duration || "";
  const hm = d.match(/(\d+)\s*h/);
  const min = d.match(/(\d+)\s*min/);
  const m = d.match(/(\d+)\s*m(?!in)/);
  let t = 0;
  if (hm) t += parseInt(hm[1]) * 60;
  if (min) t += parseInt(min[1]); else if (m) t += parseInt(m[1]);
  return t;
}
function inRuntime(item, f) {
  const t = runtimeMinutes(item);
  if (f === "short") return t < 35;
  if (f === "mid") return t >= 35 && t <= 60;
  if (f === "long") return t > 60;
  return true;
}
function avatarsOnly(who, max = 4) {
  if (!who || !who.length) return "";
  const shown = who.slice(0, max);
  const extra = who.length - shown.length;
  return `<div class="lc-avs">` + shown.map(r => `<span class="lc-av" style="background:${avColor(r.name)};">${initials(r.name)}</span>`).join("")
    + (extra > 0 ? `<span class="lc-av lc-av-more">+${extra}</span>` : "") + `</div>`;
}

/* ================= TOAST (supports an action button) ================= */
function hideToast() { $("#toast").classList.remove("show"); }
function showToast(text, action) {
  $("#toast-text").textContent = text;
  const btn = $("#toast-action");
  clearTimeout(toastTimer);
  if (action && action.label) {
    btn.textContent = action.label;
    btn.style.display = "";
    btn.onclick = () => { clearTimeout(toastTimer); hideToast(); action.onClick && action.onClick(); };
  } else {
    btn.style.display = "none";
    btn.onclick = null;
  }
  $("#toast").classList.add("show");
  toastTimer = setTimeout(() => { hideToast(); action && action.onTimeout && action.onTimeout(); }, (action && action.duration) || 3000);
}

/* ================= SEARCH ================= */
const EMPTY_RESULTS = `<div class="empty-state"><div class="empty-icon">+</div><div class="empty-text">Results appear as you type.</div></div>`;

function renderResults() {
  const q = $("#searchinput").value.trim().toLowerCase();
  const results = $("#results");
  if (!q) { results.innerHTML = EMPTY_RESULTS; return; }
  const hits = DB.filter(s => s.title.toLowerCase().includes(q));
  if (!hits.length) {
    results.innerHTML = `<div class="empty-state"><div class="empty-text">No matches for "${$("#searchinput").value}".<br><br><span class="manual-add">+ Save it anyway as a manual entry</span></div></div>`;
    return;
  }
  results.innerHTML = `<div class="results-label">Results</div>` + hits.map(s => {
    const existing = findSaved(s.title);
    return `
    <div class="result-item ${existing ? "onlist" : ""}" data-title="${s.title}">
      <div class="result-thumb">${thumbHtml(s)}</div>
      <div class="result-info">
        <div class="result-title">${s.title}</div>
        <div class="result-meta">${s.meta}</div>
        ${existing ? `<div class="result-onlist">On your list · from ${existing.who.length ? fromNames(existing.who) : "you"}</div>` : ""}
      </div>
      <div class="result-add ${existing ? "on" : ""}">${existing ? "✓" : "+"}</div>
    </div>`;
  }).join("");
  results.querySelectorAll(".result-item").forEach(el => el.addEventListener("click", () => quickSave(el.dataset.title)));
}

/* ================= SAVE-FIRST CAPTURE ================= */
function quickSave(title) {
  const dbItem = DB.find(s => s.title === title);
  const existing = findSaved(title);
  if (existing) { openSheet(existing, "existing"); return; }
  const item = { ...dbItem, who: [], archived: false, status: null };
  saved.unshift(item);
  updateCounts();
  openSheet(item, "new");
}

/* ================= ENRICH SHEET ================= */
function setNoteCollapsed(existingNote) {
  if (existingNote) {
    $("#note-toggle").textContent = "— Remove note";
    $("#note-field").style.display = "flex";
    $("#sheet-note").value = existingNote;
  } else {
    $("#note-toggle").textContent = "＋ Add a note";
    $("#note-field").style.display = "none";
    $("#sheet-note").value = "";
  }
}
function openSheet(item, mode) {
  pendingItem = item;
  currentMode = mode;
  $("#sheet-title").textContent = item.title;
  $("#sheet-sub").textContent = item.genre + " · " + item.duration;
  $("#sheet-who").value = "";
  $("#sheet-who").placeholder = mode === "existing" ? "Who else told you about this?" : "Who told you about this?";
  if (mode === "existing") {
    $("#sheet-saved-block").style.display = "block";
    $("#sheet-chips").innerHTML = whoChips(item.who, 3);
    $("#sheet-save").textContent = "Add to Shortlist";
    $("#sheet-skip").textContent = "Skip — it's already saved";
    $("#sheet-skip").style.display = "";
  } else {
    $("#sheet-saved-block").style.display = "none";
    $("#sheet-save").textContent = "Save to Shortlist";
    $("#sheet-skip").style.display = "none";
  }
  setNoteCollapsed(null);
  $("#scrim").classList.add("show");
  $("#sheet").classList.add("show");
}
function closeSheet() {
  $("#scrim").classList.remove("show");
  $("#sheet").classList.remove("show");
  pendingItem = null;
  // Reset Add screen to a clean state.
  $("#searchinput").value = "";
  $("#results").innerHTML = EMPTY_RESULTS;
  $("#searchbar").classList.remove("active");
  // Post-add return flow: bounce back to My List if we came from its shortcut.
  if (cameFromList) goList();
}

$("#note-toggle").addEventListener("click", () => {
  const hidden = $("#note-field").style.display === "none";
  if (hidden) {
    $("#note-field").style.display = "flex";
    $("#note-toggle").textContent = "— Remove note";
    $("#sheet-note").focus();
  } else {
    $("#note-field").style.display = "none";
    $("#sheet-note").value = "";
    $("#note-toggle").textContent = "＋ Add a note";
  }
});
$("#scrim").addEventListener("click", closeSheet);
$("#sheet-skip").addEventListener("click", closeSheet);
$("#sheet-save").addEventListener("click", () => {
  const who = $("#sheet-who").value.trim();
  const note = $("#sheet-note").value.trim();
  if (pendingItem && who) {
    pendingItem.who.push({ name: who, note: note || null });
    renderList();
    updateCounts();
    if ($("#m-detail").classList.contains("show") && detailIdx !== null) renderDetail();
  }
  closeSheet();
});

/* ================= MY LIST ================= */
const RT_LABEL = { short: "< 35 min", mid: "35–60 min", long: "60+ min" };
function renderFilterBubbles() {
  const rb = $("#fb-runtime");
  if (runtimeFilter) {
    rb.classList.add("is-on");
    rb.innerHTML = `<span>${RT_LABEL[runtimeFilter]}</span> <span class="fb-x" id="fb-rt-clear">✕</span>`;
    const x = $("#fb-rt-clear"); if (x) x.addEventListener("click", (e) => { e.stopPropagation(); runtimeFilter = null; renderList(); });
  } else {
    rb.classList.remove("is-on");
    rb.innerHTML = `Runtime <svg class="fb-chev" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  const ub = $("#fb-unwatched");
  ub.classList.remove("is-on");
  ub.innerHTML = hideWatched ? "Show watched" : "Hide watched";
}
function renderList() {
  const archivedAll = saved.filter(s => s.archived);
  let items = listFilter === "archived" ? archivedAll : activeSaved();
  if (listFilter !== "archived") {
    if (hideWatched) items = items.filter(s => s.status !== "watched");
    if (runtimeFilter) items = items.filter(s => inRuntime(s, runtimeFilter));
  }
  $("#listcount").textContent = listFilter === "archived" ? (archivedAll.length + " archived") : (activeSaved().length + " saved");
  renderFilterBubbles();

  let body = "";
  if (listFilter === "archived") body += `<button class="back-active" id="backactive">‹ Back to list</button>`;
  if (!items.length) {
    if (listFilter === "archived") body += `<div class="list-empty">Nothing archived yet.</div>`;
    else if (!activeSaved().length) body += `<div class="list-empty">Your list is empty —<br>add a rec to get started.</div>`;
    else body += `<div class="list-empty">No matches.<br><button class="clear-filters" id="clearfilters">Clear filters</button></div>`;
  } else {
    body += items.map(s => {
      const idx = saved.indexOf(s);
      const badge = s.archived
        ? `<div class="lc-status">${s.status === "watched" ? "✓ Watched" : "Remove from list"}</div>`
        : (s.status === "watched" ? `<div class="lc-status">✓ Watched</div>` : (s.nowWatchable ? `<div class="lc-badge">${s.nwText || "Now watchable"}</div>` : ""));
      return `
      <div class="lc" data-idx="${idx}">
        <div class="lc-img">${thumbHtml(s)}${badge}</div>
        <div class="lc-info">
          <div class="lc-title">${s.title}</div>
          <div class="lc-meta">${s.genre} · ${s.duration} · <span class="rt">🍅 ${s.rt}</span></div>
          ${avatarsOnly(s.who)}
        </div>
      </div>`;
    }).join("");
  }
  $("#reclist").innerHTML = body;
  const ba = $("#backactive"); if (ba) ba.addEventListener("click", () => { listFilter = "active"; renderList(); });
  const cf = $("#clearfilters"); if (cf) cf.addEventListener("click", () => { runtimeFilter = null; hideWatched = false; renderList(); });
  $("#reclist").querySelectorAll(".lc").forEach(el => el.addEventListener("click", () => openDetail(parseInt(el.dataset.idx))));
}
function openDetail(idx) { detailIdx = idx; detailMode = "view"; renderDetail(); $("#m-detail").classList.add("show"); }
function closeDetail() { $("#m-detail").classList.remove("show"); detailIdx = null; detailMode = "view"; }
function toggleWatched(idx) { const item = saved[idx]; item.status = item.status === "watched" ? null : "watched"; renderList(); updateCounts(); }
function renderDetail() {
  const s = saved[detailIdx];
  if (!s) { closeDetail(); return; }
  $("#detail-hero").innerHTML = thumbHtml(s);
  if (detailMode === "edit") { renderDetailEdit(s); return; }
  const recs = s.who;
  const showChips = !(recs.length === 1 && recs[0].note);
  const pills = recs.length
    ? recs.map(r => `<span class="who-chip"><span class="who-av" style="background:${avColor(r.name)};">${initials(r.name)}</span><span class="who-name">${r.name}</span></span>`).join("")
    : `<span class="who-none">No recommender noted</span>`;
  const noteBlocks = recs.filter(r => r.note).map(r => `<div class="d-note"><span class="d-note-av" style="background:${avColor(r.name)};">${initials(r.name)}</span><div class="d-note-text">${r.note}</div></div>`).join("");
  const watchedTag = s.status === "watched" ? `<span class="d-watched-tag">✓ Watched</span>` : "";
  $("#detail-body").innerHTML = `
    <div class="d-content">
      <div class="d-title">${s.title}${watchedTag}</div>
      <div class="d-meta">${s.genre} · ${s.duration} · <span class="rt">🍅 ${s.rt}</span></div>
      <div class="d-prov">${subBadge(s)}</div>
      ${recs.length ? `<div class="field-label" style="margin-top:22px;">Recommended by</div>` : ""}
      ${showChips && recs.length ? `<div class="rc-chips">${pills}</div>` : ""}
      ${noteBlocks ? `<div class="d-notes">${noteBlocks}</div>` : ""}
      <button class="d-add" id="d-add">${s.archived ? "Move back to list" : "Add more details"}</button>
    </div>`;
  if (s.archived) {
    $("#d-add").addEventListener("click", () => { s.archived = false; s.status = null; if (s._nw) s.nowWatchable = true; renderList(); updateCounts(); closeDetail(); });
  } else {
    $("#d-add").addEventListener("click", () => { detailMode = "edit"; renderDetail(); });
  }
}
function renderDetailEdit(s) {
  $("#detail-body").innerHTML = `
    <div class="d-content">
      <div class="d-edit-title">Add more details</div>
      <div class="field">
        <label>From</label>
        <input id="d-who" placeholder="Who else told you about this?" autocomplete="off">
      </div>
      <button class="note-toggle" id="d-note-toggle">＋ Add a note</button>
      <div class="field" id="d-note-field" style="display:none">
        <label>Note</label>
        <textarea id="d-note" rows="2" placeholder="What did they say about it?"></textarea>
      </div>
      <button class="sheet-cta" id="d-save">Save</button>
      <button class="sheet-skip" id="d-cancel">Cancel</button>
    </div>`;
  $("#d-note-toggle").addEventListener("click", () => {
    const hidden = $("#d-note-field").style.display === "none";
    if (hidden) { $("#d-note-field").style.display = "flex"; $("#d-note-toggle").textContent = "— Remove note"; $("#d-note").focus(); }
    else { $("#d-note-field").style.display = "none"; $("#d-note").value = ""; $("#d-note-toggle").textContent = "＋ Add a note"; }
  });
  $("#d-cancel").addEventListener("click", () => { detailMode = "view"; renderDetail(); });
  $("#d-save").addEventListener("click", () => {
    const who = $("#d-who").value.trim();
    const note = $("#d-note").value.trim();
    if (who) { s.who.push({ name: who, note: note || null }); renderList(); updateCounts(); }
    detailMode = "view";
    renderDetail();
  });
}

/* ================= ARCHIVE + UNDO ================= */
function archiveCard(idx, status) {
  const item = saved[idx];
  const card = $(`#reclist .rec-card[data-idx="${idx}"]`);
  if (card) card.classList.add("out");
  setTimeout(() => {
    item.archived = true;
    item.status = status;
    item._nw = item.nowWatchable;   // remember to restore on undo
    item.nowWatchable = false;
    renderList();
    updateCounts();
    showToast(item.title + (status === "watched" ? " marked watched" : " removed from list"), {
      label: "Undo",
      duration: 4000,
      onClick: () => {
        item.archived = false;
        item.status = null;
        if (item._nw) item.nowWatchable = true;
        renderList();
        updateCounts();
      }
    });
  }, 280);
}

/* ================= NAVIGATION ================= */
function showScreen(id) { document.querySelectorAll(".mscreen").forEach(s => s.classList.remove("active")); $("#" + id).classList.add("active"); }
function setTab(t) { $("#tab-add").classList.toggle("active", t === "add"); $("#tab-list").classList.toggle("active", t === "list"); }
function goAdd(focusSearch, fromList) {
  closeDetail();
  cameFromList = !!fromList;
  showScreen("m-add");
  setTab("add");
  $("#searchinput").value = "";
  $("#results").innerHTML = EMPTY_RESULTS;
  if (focusSearch) setTimeout(() => $("#searchinput").focus(), 60);
}
function goList() { closeDetail(); cameFromList = false; listFilter = "active"; renderList(); showScreen("m-list"); setTab("list"); }
function goTV() { showScreen("m-tv"); }

$("#tab-add").addEventListener("click", () => goAdd(false, false));
$("#tab-list").addEventListener("click", goList);
$("#list-addbtn").addEventListener("click", () => goAdd(true, true));
$("#tv-back").addEventListener("click", () => { showScreen("m-list"); setTab("list"); });
/* ===== Menus (card actions + profile) ===== */
function showMenu(items) {
  $("#menu-sheet").innerHTML = items.map((it, i) => `<button class="menu-item" data-i="${i}"${it.color ? ` style="color:${it.color};"` : ""}>${it.label}</button>`).join("");
  $("#menu-sheet").querySelectorAll(".menu-item").forEach(el => el.addEventListener("click", () => {
    const it = items[parseInt(el.dataset.i)];
    hideMenu();
    if (it.onClick) it.onClick();
  }));
  $("#menu-scrim").classList.add("show");
  $("#menu-sheet").classList.add("show");
}
function hideMenu() { $("#menu-scrim").classList.remove("show"); $("#menu-sheet").classList.remove("show"); }
$("#menu-scrim").addEventListener("click", hideMenu);
function openCardMenu(idx) {
  const item = saved[idx];
  showMenu([
    { label: "Add who recommended it", onClick: () => openSheet(item, "existing") },
    { label: "Watched", color: "var(--color-status-success)", onClick: () => archiveCard(idx, "watched") },
    { label: "Remove from list", color: "var(--color-text-muted)", onClick: () => archiveCard(idx, "passed") },
    { label: "Remove from list", color: "var(--color-status-required)", onClick: () => removeItem(idx) },
  ]);
}
function openProfileMenu() {
  showMenu([
    { label: "Settings", onClick: () => showToast("Settings — coming soon") },
    { label: "Send feedback", onClick: () => showToast("Send feedback — coming soon") },
    { label: "Sign out", onClick: () => showToast("Sign out — coming soon") },
  ]);
}
function goArchived() { listFilter = "archived"; renderList(); showScreen("m-list"); setTab("list"); }
function removeItem(idx) {
  const item = saved[idx];
  saved.splice(idx, 1);
  renderList();
  updateCounts();
  showToast(item.title + " removed", {
    label: "Undo", duration: 4000,
    onClick: () => { saved.splice(idx, 0, item); renderList(); updateCounts(); }
  });
}
document.querySelectorAll(".m-avatar").forEach(el => el.addEventListener("click", openProfileMenu));
$("#fb-runtime").addEventListener("click", openRuntimeSheet);
$("#fb-unwatched").addEventListener("click", () => { hideWatched = !hideWatched; renderList(); });
$("#d-back").addEventListener("click", closeDetail);
$("#d-share").addEventListener("click", () => showToast("Sharing — coming soon"));
$("#d-more").addEventListener("click", () => {
  const s = saved[detailIdx];
  if (!s) return;
  if (s.archived) { showMenu([{ label: "Move back to list", onClick: () => { s.archived = false; s.status = null; if (s._nw) s.nowWatchable = true; renderList(); updateCounts(); closeDetail(); } }]); return; }
  showMenu([
    { label: s.status === "watched" ? "Unmark watched" : "Mark watched", onClick: () => { toggleWatched(detailIdx); renderDetail(); } },
    { label: "Remove from list", color: "var(--color-status-required)", onClick: () => { archiveCard(detailIdx, "passed"); closeDetail(); } },
  ]);
});
$("#rt-scrim").addEventListener("click", closeRuntimeSheet);
$("#rt-done").addEventListener("click", closeRuntimeSheet);
document.querySelectorAll("#rt-sheet .rt-opt").forEach(o => o.addEventListener("click", () => {
  runtimeFilter = o.dataset.rt || null;
  document.querySelectorAll("#rt-sheet .rt-opt").forEach(x => x.classList.toggle("is-active", x === o));
  renderList();
}));
function openRuntimeSheet() {
  document.querySelectorAll("#rt-sheet .rt-opt").forEach(o => o.classList.toggle("is-active", (o.dataset.rt || null) === runtimeFilter));
  $("#rt-scrim").classList.add("show"); $("#rt-sheet").classList.add("show");
}
function closeRuntimeSheet() { $("#rt-scrim").classList.remove("show"); $("#rt-sheet").classList.remove("show"); }

$("#searchinput").addEventListener("focus", () => $("#searchbar").classList.add("active"));
$("#searchinput").addEventListener("blur", () => { if (!$("#searchinput").value) $("#searchbar").classList.remove("active"); });
$("#searchinput").addEventListener("input", renderResults);

function updateCounts() { $("#tab-list-label").textContent = "My List"; }

/* ================= THEME ================= */
/* Mobile defaults to light; TV uses .theme-tv-dark. Both share the same
   semantic tokens, so a future dark toggle is a one-line class swap. */
function setTheme(mode) {
  const root = document.documentElement;
  root.classList.remove("theme-tv-dark", "theme-mobile-light");
  if (mode === "mobile-light") root.classList.add("theme-mobile-light");
  if (mode === "tv-dark") root.classList.add("theme-tv-dark");
}
setTheme("mobile-light");

/* ================= INIT ================= */
$("#results").innerHTML = EMPTY_RESULTS;
renderList();
updateCounts();
</script>
</body>
</html>
